<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="1440" height="960" fill="#070a12"/><rect x="52" y="52" width="1336" height="856" rx="34" fill="#0b1120" stroke="#263244"/><text x="92" y="112" fill="#e5edf8" font-family="Inter,Microsoft YaHei" font-size="24" font-weight="700">人性化流程与流程图编排规则</text><text x="92" y="142" fill="#7f8ea3" font-family="Inter,Microsoft YaHei" font-size="14">主路径垂直，失败侧挂，验证可见，复用沉淀</text><g font-family="Inter,Microsoft YaHei" font-size="14"><rect x="114" y="220" width="210" height="78" rx="24" fill="#10172a" stroke="#2a3650"/><text x="162" y="255" fill="#e5edf8">首次启动</text><text x="142" y="280" fill="#7f8ea3">问用户想做什么</text><path d="M324 259 H410" stroke="#22d3ee" stroke-width="3"/><rect x="410" y="220" width="210" height="78" rx="24" fill="#10172a" stroke="#2a3650"/><text x="455" y="255" fill="#e5edf8">选择入口</text><text x="438" y="280" fill="#7f8ea3">Agent / 流程 / Replay</text><path d="M620 259 H706" stroke="#22d3ee" stroke-width="3"/><rect x="706" y="220" width="210" height="78" rx="24" fill="#10172a" stroke="#2a3650"/><text x="754" y="255" fill="#e5edf8">运行前体检</text><text x="734" y="280" fill="#7f8ea3">模型、权限、窗口</text><path d="M916 259 H1002" stroke="#22d3ee" stroke-width="3"/><rect x="1002" y="220" width="210" height="78" rx="24" fill="#10172a" stroke="#2a3650"/><text x="1050" y="255" fill="#e5edf8">执行并观察</text><text x="1030" y="280" fill="#7f8ea3">动作时间线可见</text><path d="M1107 298 V380" stroke="#22d3ee" stroke-width="3"/><rect x="1002" y="380" width="210" height="78" rx="24" fill="#0b1f1a" stroke="#34d399"/><text x="1050" y="415" fill="#e5edf8">证据验证</text><text x="1030" y="440" fill="#7f8ea3">截图 / 文件 / 状态</text><path d="M1002 419 H916" stroke="#f59e0b" stroke-width="3"/><rect x="706" y="380" width="210" height="78" rx="24" fill="#221a0b" stroke="#f59e0b"/><text x="754" y="415" fill="#e5edf8">失败分类</text><text x="734" y="440" fill="#7f8ea3">焦点 / 控件 / OCR</text><path d="M811 458 V540 H1107 V458" stroke="#f59e0b" stroke-width="3" fill="none"/><path d="M1107 458 V560" stroke="#22d3ee" stroke-width="3"/><rect x="1002" y="560" width="210" height="78" rx="24" fill="#10172a" stroke="#2a3650"/><text x="1050" y="595" fill="#e5edf8">复用沉淀</text><text x="1030" y="620" fill="#7f8ea3">模板 / WPS / FlowScript</text></g><rect x="114" y="700" width="1210" height="126" rx="28" fill="#10172a" stroke="#2a3650"/><text x="152" y="746" fill="#e5edf8" font-family="Inter,Microsoft YaHei" font-size="18" font-weight="700">流程图排版硬规则</text><text x="152" y="780" fill="#7f8ea3" font-family="Inter,Microsoft YaHei" font-size="14">1. 成功主路径自上而下。2. 失败恢复向右展开。3. 高风险动作后必须接验证门。4. 重试最多 1–3 次。5. WPS-only 步骤保留占位，不假装成功。</text></svg>