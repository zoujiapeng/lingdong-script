<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>灵动脚本前端重设计原型</title>
<style>
:root{--bg:#070a12;--panel:rgba(16,23,42,.72);--line:rgba(148,163,184,.16);--text:#e5edf8;--muted:#7f8ea3;--a:#7c3aed;--b:#22d3ee;--good:#34d399;--warn:#f59e0b;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,rgba(124,58,237,.22),transparent 36%),radial-gradient(circle at 80% 0,rgba(34,211,238,.16),transparent 32%),var(--bg);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;color:var(--text)}.app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}.rail{border-right:1px solid var(--line);background:rgba(3,7,18,.58);padding:14px 10px}.logo{width:44px;height:44px;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 40px rgba(34,211,238,.28);margin:0 auto 26px}.nav{display:grid;gap:10px}.nav button{height:48px;border:1px solid transparent;border-radius:18px;background:transparent;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--text)}.main{display:grid;grid-template-rows:72px 1fr}.dock{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(3,7,18,.36);backdrop-filter:blur(18px)}.search{flex:1;display:flex;align-items:center;padding:0 16px;height:44px;border:1px solid var(--line);border-radius:18px;background:rgba(15,23,42,.72);color:var(--muted)}.chip{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;color:var(--muted)}.run{border:0;border-radius:16px;padding:12px 18px;background:linear-gradient(135deg,var(--a),var(--b));color:white;font-weight:700}.content{padding:22px;display:grid;grid-template-columns:1.1fr .9fr 360px;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.32);backdrop-filter:blur(18px);overflow:hidden}.card h2{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:15px}.screen{height:420px;margin:18px;border-radius:22px;background:linear-gradient(145deg,#0f172a,#020617);border:1px solid var(--line);position:relative}.screen:after{content:"WinPilot Live Screen";position:absolute;left:24px;top:24px;color:var(--muted);font-size:12px}.task{margin:18px;border:1px solid var(--line);border-radius:22px;padding:16px;background:rgba(255,255,255,.05);color:var(--muted)}.timeline{padding:16px 20px;display:grid;gap:14px}.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}.dot{width:22px;height:22px;border-radius:999px;background:rgba(34,211,238,.16);border:1px solid rgba(34,211,238,.5)}.step b{display:block;font-size:13px}.step span{font-size:12px;color:var(--muted)}.evidence{padding:16px;display:grid;gap:12px}.ev{height:82px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);padding:12px}.ev b{font-size:12px}.ev p{margin:8px 0 0;color:var(--muted);font-size:12px}.flow{height:250px;margin:18px;border-radius:22px;border:1px solid var(--line);background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:22px 22px;position:relative}.node{position:absolute;width:150px;padding:12px;border-radius:18px;background:rgba(15,23,42,.92);border:1px solid rgba(34,211,238,.35);font-size:12px}.n1{left:50%;top:20px;transform:translateX(-50%)}.n2{left:50%;top:100px;transform:translateX(-50%)}.n3{right:24px;top:100px;border-color:rgba(245,158,11,.55)}@media(max-width:1100px){.content{grid-template-columns:1fr}.app{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>
<body><div class="app"><aside class="rail"><div class="logo"></div><div class="nav"><button class="active">总览</button><button>Agent</button><button>流程</button><button>Replay</button><button>设置</button></div></aside><main class="main"><div class="dock"><div class="search">搜索指令、模板、trace、节点组合…</div><span class="chip">WinPilot 在线</span><span class="chip">模型已配置</span><button class="run">运行</button></div><section class="content"><div class="card"><h2>Agent Cockpit</h2><div class="task">让电脑打开目标软件，完成操作，并用截图或文件证据确认成功。</div><div class="screen"></div></div><div class="card"><h2>Automation Studio</h2><div class="flow"><div class="node n1">开始 / 定位窗口</div><div class="node n2">执行动作</div><div class="node n3">失败恢复</div></div><div class="task">主路径垂直，失败路径右侧展开，高风险动作后必须有验证门。</div></div><div class="card"><h2>Evidence & Timeline</h2><div class="timeline"><div class="step"><div class="dot"></div><div><b>理解任务</b><span>提取目标窗口、约束和成功条件</span></div></div><div class="step"><div class="dot"></div><div><b>执行动作</b><span>批量动作、低延迟控制、屏幕变化观察</span></div></div><div class="step"><div class="dot"></div><div><b>验证结果</b><span>截图、OCR、文件、窗口状态</span></div></div></div><div class="evidence"><div class="ev"><b>可复用建议</b><p>保存为模板 / 导出 WPS / 导入流程图</p></div><div class="ev"><b>安全护栏</b><p>窗口限定、命令确认、敏感输入保护</p></div></div></div></section></main></div></body></html>
