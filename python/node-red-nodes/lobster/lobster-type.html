<script type="text/html" data-template-name="lobster-type">
    <div class="form-row">
        <label for="node-input-text">输入文本</label>
        <input type="text" id="node-input-text" placeholder="Hello World" style="width:70%;">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('lobster-type', {
        category: 'lobster',
        color: '#89b4fa',
        defaults: {
            text: { value: '', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font.svg',
        label: function () {
            return '输入: ' + (this.text || '').substring(0, 20);
        }
    });
</script>
