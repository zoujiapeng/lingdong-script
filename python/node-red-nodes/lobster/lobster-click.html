<script type="text/html" data-template-name="lobster-click">
    <div class="form-row">
        <label for="node-input-x">X 坐标</label>
        <input type="number" id="node-input-x" placeholder="100">
    </div>
    <div class="form-row">
        <label for="node-input-y">Y 坐标</label>
        <input type="number" id="node-input-y" placeholder="200">
    </div>
    <div class="form-row">
        <label for="node-input-method">点击方式</label>
        <select id="node-input-method">
            <option value="click">单击</option>
            <option value="double_click">双击</option>
            <option value="right_click">右键</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="lobster-click">
    <p>调用 Lobster 引擎执行屏幕坐标点击。</p>
    <p>通过 HTTP API (localhost:5877) 与后端通信。</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('lobster-click', {
        category: 'lobster',
        color: '#a6e3a1',
        defaults: {
            x: { value: 0, required: true },
            y: { value: 0, required: true },
            method: { value: 'click', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'mouse-pointer.svg',
        label: function () {
            return '点击 (' + this.x + ', ' + this.y + ')';
        }
    });
</script>
